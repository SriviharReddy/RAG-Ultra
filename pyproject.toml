[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-ultra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.1",
    "numpy>=2.0",
    "pillow>=12.2.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["core", "my_agent"]
