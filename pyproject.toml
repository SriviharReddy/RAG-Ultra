[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-ultra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.0",
    "fastapi[all]>=0.136.3",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.1",
    "numpy>=2.0",
    "pillow>=12.2.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["core", "my_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",  # Function call in default arg — FastAPI File()/Form() idiom
    "B905",  # zip() without strict= — intentional
    "E501",  # Line length handled by formatter
    "E741",  # Ambiguous variable names (common in math contexts)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "my_agent", "schemas"]
